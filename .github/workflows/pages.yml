# Publishes the site: the app (web/, with data/terms/*.json under /data/) and
# the A9 reachability probe under /probe/.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "probe/**"
      - "data/terms/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to publish"
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the app
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/dist/. _site/
          mkdir -p _site/probe
          cp -r probe/. _site/probe/
          # فایل تصادفی غیرقابل فشرده‌سازی برای سنجش سرعت دانلود
          head -c 1048576 /dev/urandom > _site/probe/payload.bin
          printf '{"commit":"%s","builtAt":"%s"}\n' "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/probe/build-info.json
          ls -R _site | head -40
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
