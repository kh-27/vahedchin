# NFR-10, NFR-13: parser tests (including the reference PDFs) and coverage >= 90%.
name: Pipeline tests

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/pipeline-tests.yml"
  pull_request:
    paths:
      - "pipeline/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest --cov --cov-report=term-missing
