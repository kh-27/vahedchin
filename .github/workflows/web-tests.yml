# NFR-01..03, NFR-10: core logic tests, timings and coverage >= 90%.
name: Web tests

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/terms/**"
      - ".github/workflows/web-tests.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Tests and timings (uninstrumented)
        run: npx vitest run --silent=false
      - name: Coverage
        run: npm run test:cov
