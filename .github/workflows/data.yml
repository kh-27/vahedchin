# FR-60, FR-63, NFR-16: a pushed report 110 PDF becomes data/terms/<term>.json
# and the site is redeployed. Any invalid value or a clipped print fails the
# run (FR-62, FR-68) and nothing is committed or published (BR-9).
name: Data pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/raw/**.pdf"
      - "pipeline/golestan/**" # parser changed: re-parse every source PDF
      - "pipeline/requirements.txt"
  workflow_dispatch:
    inputs:
      pdf:
        description: "PDF to parse (default: every PDF in data/raw)"
        required: false

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # NFR-12
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Find PDFs to parse
        id: pdfs
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_PDF: ${{ inputs.pdf }}
        run: |
          if [ -n "$INPUT_PDF" ]; then
            printf '%s\n' "$INPUT_PDF" > pdfs.txt
          elif [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null &&
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- pipeline/golestan pipeline/requirements.txt; then
            git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'data/raw/*.pdf' > pdfs.txt
          else
            ls data/raw/*.pdf > pdfs.txt
          fi
          echo "PDFs:"; cat pdfs.txt
          test -s pdfs.txt || { echo "::error::no PDF to parse"; exit 1; }

      - name: Parse and validate
        run: |
          : > terms.txt
          while IFS= read -r pdf; do
            echo "::group::$pdf"
            python -m golestan "../$pdf" --out-dir ../data/terms \
              --summary "$GITHUB_STEP_SUMMARY" --github-output "$RUNNER_TEMP/out.txt"
            echo "::endgroup::"
            . "$RUNNER_TEMP/out.txt"
            echo "$term $report_date" >> ../terms.txt
          done < ../pdfs.txt
        working-directory: pipeline

      - name: Commit data
        id: commit
        run: |
          git add data/terms
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data/terms is unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: $(paste -sd ', ' terms.txt)" -m "Generated by the data pipeline from: $(paste -sd ' ' pdfs.txt)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN does not trigger other workflows, so deploy here.
  deploy:
    needs: parse
    if: needs.parse.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: main
